name: Bug report
description: Report a reproducible defect in the reusable codebase.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This repository is archived. Please report only reproducible code or documentation defects; do not submit retailer data, affiliate credentials, or requests to reactivate findsera.com.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node version, operating system, and command run
    validations:
      required: true
